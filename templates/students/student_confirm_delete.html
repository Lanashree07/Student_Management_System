{% extends 'base.html' %}

{% block title %}Delete Student | EduManage{% endblock %}

{% block content %}
<div class="header">
    <h1>Delete Student</h1>
</div>

<div class="glass-card" style="max-width: 600px; margin: 0 auto; text-align: center; padding: 3rem 2rem;">
    <svg width="48" height="48" fill="none" stroke="#ef4444" viewBox="0 0 24 24" style="margin-bottom: 1.5rem;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
    </svg>
    
    <h2 style="margin-bottom: 1rem; font-size: 1.5rem;">Are you sure?</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
        Do you really want to delete <strong>{{ object.first_name }} {{ object.last_name }}</strong>? This action cannot be undone.
    </p>
    
    <form method="post" style="display: flex; justify-content: center; gap: 1rem;">
        {% csrf_token %}
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
    </form>
</div>
{% endblock %}
